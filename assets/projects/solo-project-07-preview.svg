<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow7" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>
    <pattern id="grid7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow7)"/>
  <rect width="800" height="450" fill="url(#grid7)"/>

  <!-- Glowing Focal Rings -->
  <circle cx="400" cy="210" r="130" fill="none" stroke="rgba(255,42,58,0.12)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="400" cy="210" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="400" cy="210" r="45" fill="rgba(255,42,58,0.06)" stroke="rgba(255,42,58,0.3)" stroke-width="1.5"/>

  <!-- Center Icon: Geometry / Interactive Simulation -->
  <g transform="translate(378, 188)">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ff2a3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </svg>
  </g>

  <!-- Technical Telemetry Labels -->
  <text x="400" y="305" font-family="'Outfit', -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">SOLO ARCHITECTURE // VOL. 07</text>
  <text x="400" y="328" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#94a3b8" text-anchor="middle">SPATIAL GEOMETRY &amp; INTERACTIVE SIMULATION</text>

  <!-- Status Pill -->
  <g transform="translate(315, 350)">
    <rect width="170" height="26" rx="13" fill="rgba(255,42,58,0.12)" stroke="rgba(255,42,58,0.35)" stroke-width="1"/>
    <circle cx="20" cy="13" r="4" fill="#ff2a3a"/>
    <text x="32" y="17" font-family="'Outfit', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#ffffff">BENCHMARKING QUEUE</text>
  </g>
</svg>
